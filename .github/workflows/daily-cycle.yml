name: Daily collections cycle

# Plays the role of Cloud Scheduler: starts the agent's morning run.
# 05:17 UTC is 08:17 in Addis Ababa, just after contact hours open. GitHub
# delays or drops scheduled runs at busy times (especially on the hour), so a
# second run at 08:47 UTC (11:47 Addis) is a backup. Running twice is safe: the
# server holds a lock and the one-message-a-day rule stops repeat messages.
on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '47 8 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the server (the free host sleeps when idle)
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -sf --max-time 60 "${{ secrets.API_URL }}/api/health"; then echo; exit 0; fi
            echo "attempt $attempt: not awake yet"; sleep 10
          done
          exit 1
      - name: Start the cycle
        run: |
          code=$(curl -s -o response.json -w '%{http_code}' --max-time 30 \
            -X POST "${{ secrets.API_URL }}/api/cycle/run" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          cat response.json; echo
          [ "$code" = "202" ] || [ "$code" = "200" ]
